# Topología de 5 servicios:
#   1. gateway  : Proxy inverso perimetral Nginx (Puerto 80 perimetral)
#   2. frontend : SPA Angular 22 compilada en contenedor Nginx no privilegiado
#   3. backend  : API REST Laravel 11/12 (PHP 8.3 Alpine)
#   4. database : Persistencia relacional MySQL 8.0
#   5. ollama   : Motor de inferencia para LLMs locales (qwen2.5:1.5b)

services:
  # ----------------------------------------------------------------------------
  # 1. Gateway perimetral (Proxy Inverso Nginx)
  # Punto único de entrada al clúster: rutea / hacia frontend y /api/ hacia backend
  # ----------------------------------------------------------------------------
  gateway:
    build:
      context: ./infrastructure/proxy
      dockerfile: Dockerfile
    image: slep/gateway:1.0.0
    container_name: slep-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:8080"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - slep-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 2. Frontend SPA (Angular 22)
  # Servidor estático optimizado con Nginx no privilegiado (sin Node.js en prod)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    image: slep/frontend:1.0.0
    container_name: slep-frontend
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - slep-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 3. Backend API (Laravel 11 / PHP 8.3)
  # Lógica de negocio, bitácora auditable, Kardex y conector desacoplado con Ollama
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./services/backend/api-inventario
      dockerfile: Dockerfile
    image: slep/backend:1.0.0
    container_name: slep-backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      APP_NAME: "${APP_NAME:-SLEP-Inventario}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:-base64:c2xlcC1sb3MtbGliZXJ0YWRvcmVzLWFwcC1rZXkxMjM=}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost}"
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-slep_db}"
      DB_USERNAME: "${DB_USERNAME:-slep_user}"
      DB_PASSWORD: "${DB_PASSWORD:-slep_secret_2026}"
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      AUTO_MIGRATE: "${AUTO_MIGRATE:-true}"
      OLLAMA_ENABLED: "${OLLAMA_ENABLED:-true}"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:1.5b}"
      OLLAMA_TIMEOUT: "${OLLAMA_TIMEOUT:-60}"
      OLLAMA_CONNECT_TIMEOUT: "${OLLAMA_CONNECT_TIMEOUT:-3}"
    volumes:
      - backend-storage:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - slep-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 4. Base de Datos Relacional (MySQL 8.0)
  # Aislada en red interna; expuesta en loopback (127.0.0.1) solo para scripts locales de backup
  # ----------------------------------------------------------------------------
  database:
    image: mysql:8.0.40
    container_name: slep-database
    restart: unless-stopped
    command:
      - "--default-authentication-plugin=mysql_native_password"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-slep_db}"
      MYSQL_USER: "${DB_USERNAME:-slep_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-slep_secret_2026}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-slep_root_secret_2026}"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - slep-net
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "${DB_USERNAME:-slep_user}",
          "-p${DB_PASSWORD:-slep_secret_2026}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------------------------
  # 5. Servicio de Inteligencia Artificial (Ollama)
  # Modelo local para sugerencias de categorías de activos patrimoniales
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.40.7
    container_name: slep-ollama
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - slep-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# ----------------------------------------------------------------------------
# Redes personalizadas
# ----------------------------------------------------------------------------
networks:
  slep-net:
    driver: bridge
    name: slep-network

# ----------------------------------------------------------------------------
# Volúmenes persistentes
# ----------------------------------------------------------------------------
volumes:
  db-data:
    name: slep-mysql-data
  ollama-models:
    name: slep-ollama-models
  backend-storage:
    name: slep-backend-storage
