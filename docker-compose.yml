# Topología de 8 servicios (Arquitectura desacoplada de Microservicios):
#   1. gateway            : API Gateway perimetral Nginx (Puerto 80 perimetral)
#   2. frontend           : SPA Angular 22 compilada en contenedor Nginx no privilegiado
#   3. backend-usuarios   : Microservicio de Identidad, Roles y Autenticación (RF-01)
#   4. backend-inventario : Microservicio de Activos, Kardex e IA con Ollama (RF-02/RF-04)
#   5. backend-flujos     : Microservicio de Solicitudes, Segregación y Auditoría (RF-03/RF-05)
#   6. database           : Persistencia relacional MySQL 8.0
#   7. ollama             : Motor de inferencia para LLMs locales (qwen2.5:1.5b)
#   8. monitoring         : Observabilidad y gestión visual con Portainer CE

services:
  # ----------------------------------------------------------------------------
  # 1. Gateway perimetral (API Gateway Nginx)
  # Punto único de entrada al clúster: rutea /, /api/auth/, /api/movimientos/, /api/
  # ----------------------------------------------------------------------------
  gateway:
    build:
      context: ./infrastructure/proxy
      dockerfile: Dockerfile
    image: slep/gateway:1.0.0
    container_name: slep-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:8080"
    depends_on:
      frontend:
        condition: service_healthy
      backend-usuarios:
        condition: service_healthy
      backend-inventario:
        condition: service_healthy
      backend-flujos:
        condition: service_healthy
    networks:
      - slep-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 2. Frontend SPA (Angular 22)
  # Servidor estático optimizado con Nginx no privilegiado (sin Node.js en prod)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    image: slep/frontend:1.0.0
    container_name: slep-frontend
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - slep-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 3. Microservicio 1: API de Usuarios y Autenticación (RF-01)
  # Control de acceso, login/logout, tokens Sanctum y perfiles diferenciados
  # ----------------------------------------------------------------------------
  backend-usuarios:
    build:
      context: ./services/backend/api-usuarios
      dockerfile: Dockerfile
    image: slep/backend-usuarios:1.0.0
    container_name: slep-api-usuarios
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      APP_NAME: "${APP_NAME:-SLEP-Usuarios}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:-base64:c2xlcC1sb3MtbGliZXJ0YWRvcmVzLWFwcC1rZXkxMjM=}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost}"
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-slep_db}"
      DB_USERNAME: "${DB_USERNAME:-slep_user}"
      DB_PASSWORD: "${DB_PASSWORD:-slep_secret_2026}"
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      AUTO_MIGRATE: "false"
    volumes:
      - backend-usuarios-storage:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy
    networks:
      - slep-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 4. Microservicio 2: API de Inventario, Activos, Kardex e IA (RF-02 y RF-04)
  # Registro de bienes, existencias en tiempo real y clasificación asistida con Ollama
  # ----------------------------------------------------------------------------
  backend-inventario:
    build:
      context: ./services/backend/api-inventario
      dockerfile: Dockerfile
    image: slep/backend-inventario:1.0.0
    container_name: slep-api-inventario
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      APP_NAME: "${APP_NAME:-SLEP-Inventario}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:-base64:c2xlcC1sb3MtbGliZXJ0YWRvcmVzLWFwcC1rZXkxMjM=}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost}"
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-slep_db}"
      DB_USERNAME: "${DB_USERNAME:-slep_user}"
      DB_PASSWORD: "${DB_PASSWORD:-slep_secret_2026}"
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      AUTO_MIGRATE: "${AUTO_MIGRATE:-true}"
      OLLAMA_ENABLED: "${OLLAMA_ENABLED:-true}"
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:1.5b}"
      OLLAMA_TIMEOUT: "${OLLAMA_TIMEOUT:-60}"
      OLLAMA_CONNECT_TIMEOUT: "${OLLAMA_CONNECT_TIMEOUT:-3}"
    volumes:
      - backend-inventario-storage:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - slep-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 5. Microservicio 3: API de Flujos y Auditoría (RF-03 y RF-05)
  # Solicitudes de movimientos, segregación de funciones y bitácora de transacciones
  # ----------------------------------------------------------------------------
  backend-flujos:
    build:
      context: ./services/backend/api-flujos
      dockerfile: Dockerfile
    image: slep/backend-flujos:1.0.0
    container_name: slep-api-flujos
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      APP_NAME: "${APP_NAME:-SLEP-Flujos}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:-base64:c2xlcC1sb3MtbGliZXJ0YWRvcmVzLWFwcC1rZXkxMjM=}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost}"
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-slep_db}"
      DB_USERNAME: "${DB_USERNAME:-slep_user}"
      DB_PASSWORD: "${DB_PASSWORD:-slep_secret_2026}"
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      AUTO_MIGRATE: "false"
    volumes:
      - backend-flujos-storage:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy
    networks:
      - slep-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 6. Base de Datos Relacional (MySQL 8.0)
  # Aislada en red interna; expuesta en loopback (127.0.0.1) solo para scripts locales de backup
  # ----------------------------------------------------------------------------
  database:
    image: mysql:8.0.40
    container_name: slep-database
    restart: unless-stopped
    command:
      - "--default-authentication-plugin=mysql_native_password"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-slep_db}"
      MYSQL_USER: "${DB_USERNAME:-slep_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-slep_secret_2026}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-slep_root_secret_2026}"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - slep-net
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "${DB_USERNAME:-slep_user}",
          "-p${DB_PASSWORD:-slep_secret_2026}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------------------------
  # 7. Servicio de Inteligencia Artificial (Ollama)
  # Modelo local para sugerencias de categorías de activos patrimoniales
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.40.7
    container_name: slep-ollama
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - slep-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 8. Servicio de Monitoreo y Observabilidad (Portainer CE)
  # Visualización gráfica de métricas de contenedores, CPU, RAM y logs en vivo
  # ----------------------------------------------------------------------------
  monitoring:
    image: portainer/portainer-ce:2.27.1-alpine
    container_name: slep-monitoring
    restart: unless-stopped
    command: --base-url /portainer
    ports:
      - "${PORTAINER_PORT:-9000}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      - slep-net

# ----------------------------------------------------------------------------
# Redes personalizadas
# ----------------------------------------------------------------------------
networks:
  slep-net:
    driver: bridge
    name: slep-network

# ----------------------------------------------------------------------------
# Volúmenes persistentes
# ----------------------------------------------------------------------------
volumes:
  db-data:
    name: slep-mysql-data
  ollama-models:
    name: slep-ollama-models
  backend-inventario-storage:
    name: slep-inventario-storage
  backend-usuarios-storage:
    name: slep-usuarios-storage
  backend-flujos-storage:
    name: slep-flujos-storage
  portainer-data:
    name: slep-portainer-data
