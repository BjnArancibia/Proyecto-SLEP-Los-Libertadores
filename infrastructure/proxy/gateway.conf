# ==============================================================================
# Configuración del Gateway Perimetral Nginx - SLEP Los Libertadores
# API Gateway con enrutamiento a 3 Microservicios + Frontend + Monitoreo
# ==============================================================================

# Soporte de conmutación para WebSockets
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream frontend_app {
    server frontend:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream monitoring_ui {
    server monitoring:9000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# Upstreams para los 3 Microservicios del Backend
# ------------------------------------------------------------------------------
upstream usuarios_api {
    server backend-usuarios:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream flujos_api {
    server backend-flujos:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream inventario_api {
    server backend-inventario:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 8080;
    server_name localhost _;

    # Compresión gzip perimetral
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Endpoint de salud del gateway
    location = /healthz {
        access_log off;
        return 200 "gateway-healthy\n";
    }

    # Redirección canónica /portainer -> /portainer/
    location = /portainer {
        return 301 /portainer/;
    }

    # --------------------------------------------------------------------------
    # Panel de Monitoreo y Observabilidad (Portainer CE)
    # --------------------------------------------------------------------------
    location /portainer/ {
        proxy_pass http://monitoring_ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte para WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # --------------------------------------------------------------------------
    # 1. Microservicio de Usuarios y Autenticación (RF-01)
    # --------------------------------------------------------------------------
    location /api/auth/ {
        proxy_pass http://usuarios_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/user {
        proxy_pass http://usuarios_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 2. Microservicio de Flujos de Aprobación y Auditoría (RF-03 y RF-05)
    # --------------------------------------------------------------------------
    location /api/movimientos {
        proxy_pass http://flujos_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/bitacora {
        proxy_pass http://flujos_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 3. Microservicio de Inventario, Activos, Kardex e IA (RF-02 y RF-04)
    # Ruteo por defecto para cualquier otra ruta de API (/api/activos, /api/kardex, /api/ia, /api/health)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://inventario_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts generosos para permitir inferencia de IA en modelos locales
        proxy_connect_timeout 10s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # --------------------------------------------------------------------------
    # Interfaz web SPA Angular (Fallback a index.html)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
